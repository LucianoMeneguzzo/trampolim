# Sobe o projeto inteiro com um comando: banco PostgreSQL, back-end e front-end.
#
#   1. Copie ".env.example" para ".env" (nesta mesma pasta) e preencha as duas senhas.
#   2. docker compose up --build
#   3. Abra http://localhost:5173
#
# Para parar: Ctrl+C. Para apagar também os dados do banco: docker compose down -v

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: trampolim
      POSTGRES_USER: trampolim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - dados-do-banco:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trampolim -d trampolim"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Sem "ports": só o back-end alcança o banco, ninguém de fora

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/trampolim
      DB_USERNAME: trampolim
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    ports:
      - "127.0.0.1:8080:8080" # só a sua máquina acessa, não a rede inteira
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:8080"

volumes:
  dados-do-banco:
