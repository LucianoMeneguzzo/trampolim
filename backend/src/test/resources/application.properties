# Configuração usada só pelos testes: banco H2 em memória, recriado a cada execução.
spring.datasource.url=jdbc:h2:mem:trampolim;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

jwt.secret=chave-de-teste-com-mais-de-trinta-e-dois-caracteres-123456
jwt.expiration=3600000

app.cors.allowed-origins=http://localhost:5173

# Os testes criam os próprios dados
app.dados-de-exemplo=false
