# Configuração do Banco de Dados (Exemplo com MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/trampolim_banco?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=sua_senha_aqui

# Configuração do JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Configuração de E-mail (Exemplo com SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=seu_email@gmail.com
spring.mail.password=sua_senha_de_aplicativo
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Configuração do JWT (use variáveis de ambiente em produção)
jwt.segredo=chave_secreta_muito_longa_e_segura_para_assinatura_do_token
jwt.expiracao=86400000spring.application.name=demo
