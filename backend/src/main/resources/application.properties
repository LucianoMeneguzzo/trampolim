# Nome da aplicação
spring.application.name=trampolim-api

# =========================================================
# CONFIGURAÇÃO DE BANCO DE DADOS DINÂMICA
# Se as variáveis de ambiente (do arquivo .env) existirem, usa PostgreSQL.
# Se NÃO existirem, usa H2 em memória automaticamente.
# =========================================================
spring.datasource.url=${DB_URL:jdbc:h2:mem:trampolimdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# O Hibernate detecta o dialeto automaticamente pela URL do datasource.

# =========================================================
# CONFIGURAÇÕES JPA / HIBERNATE
# =========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =========================================================
# CONFIGURAÇÃO JWT (nomes alinhados com o JwtService.java)
# =========================================================
jwt.secret=${JWT_SECRET:chave-secreta-padrao-para-desenvolvimento-local-sem-env-1234567890abcdef}
jwt.expiration=${JWT_EXPIRATION:86400000}

# =========================================================
# CONFIGURAÇÕES ESPECÍFICAS DO H2
# =========================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false