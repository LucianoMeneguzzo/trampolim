# Nome da aplicação
spring.application.name=trampolim-api

# Porta: as hospedagens (Render, Railway) informam a porta pela variável PORT
server.port=${PORT:8080}

# Segredos (senha do banco, chave do JWT) NÃO ficam neste arquivo, que vai para o GitHub.
# Eles vêm de variáveis de ambiente ou do arquivo backend/.env (ignorado pelo git).
# Copie backend/.env.example para backend/.env e preencha.

# =========================================================
# CONFIGURAÇÃO DE BANCO DE DADOS DINÂMICA
# Se as variáveis de ambiente (do arquivo .env) existirem, usa PostgreSQL.
# Se NÃO existirem, usa H2 em memória automaticamente.
# =========================================================
spring.datasource.url=${DB_URL:jdbc:h2:mem:trampolimdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# O Hibernate detecta o dialeto automaticamente pela URL do datasource.

# =========================================================
# CONFIGURAÇÕES JPA / HIBERNATE
# =========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =========================================================
# CONFIGURAÇÃO JWT (nomes alinhados com o JwtService.java)
# A chave precisa ter pelo menos 32 caracteres (256 bits).
# Vazia = o JwtService sorteia uma chave a cada vez que o backend sobe (os logins caem ao reiniciar)
# =========================================================
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

# =========================================================
# Endereços do front que podem chamar a API (separados por vírgula)
# =========================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# =========================================================
# Freio contra força bruta no login e no cadastro (contagem por IP, na memória do back)
#   login: 5 senhas erradas para o mesmo e-mail (ou 50 no total, vindas do mesmo IP) bloqueiam por 15 minutos
#   cadastro: no máximo 20 tentativas por hora a partir do mesmo IP
# Quem passa do limite recebe 429. Aumente os números se muita gente usar a mesma rede (ex.: uma sala de aula).
# =========================================================
app.limite.login.erros-por-email=5
app.limite.login.erros-por-ip=50
app.limite.login.minutos=15
app.limite.cadastros-por-hora=20

# =========================================================
# E-MAIL (avisos de inscrição, entrega e avaliação)
# Qualquer servidor SMTP serve: Gmail, Brevo, Mailtrap... Sem MAIL_HOST, o aviso só aparece no log.
# =========================================================
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Não fica esperando para sempre se o servidor de e-mail não responder
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# Quem aparece como remetente. Sem MAIL_FROM, usa o próprio usuário do SMTP.
app.email.remetente=${MAIL_FROM:${MAIL_USERNAME:}}
# O servidor de e-mail fora do ar não deve fazer o /actuator/health dizer que o back caiu
management.health.mail.enabled=false

# =========================================================
# Monitoramento: só /actuator/health fica exposto, e sem detalhes (responde {"status":"UP"})
# =========================================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# =========================================================
# API do GitHub (valida o repositório enviado pelo aluno).
# Sem token o GitHub limita a 60 consultas por hora por IP; em produção, defina GITHUB_TOKEN.
# =========================================================
app.github.api-url=https://api.github.com
app.github.token=${GITHUB_TOKEN:}

# =========================================================
# CONFIGURAÇÕES ESPECÍFICAS DO H2
# O console só serve em desenvolvimento; o perfil de produção (application-prod.properties) desliga
# =========================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false
