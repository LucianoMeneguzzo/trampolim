# Segredos (senha do banco, chave do JWT) NÃO ficam neste arquivo, que vai para o GitHub.
# Eles vêm de variáveis de ambiente ou do arquivo backend/.env (ignorado pelo git).
# Copie backend/.env.example para backend/.env e preencha.
# Sem o .env, o backend sobe mesmo assim: banco em memória (H2) e chave do JWT aleatória.
spring.config.import=optional:file:.env[.properties]

# Configuração do Banco de Dados (Supabase - PostgreSQL)
# Note o "jdbc:" no início da URL, que é obrigatório para o Spring Boot
# Depois dos ":" vem o valor usado quando DB_URL não existe (H2, os dados somem ao parar)
spring.datasource.url=${DB_URL:jdbc:h2:mem:trampolim;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Configuração do Hibernate (JPA)
# "update" cria ou atualiza as tabelas automaticamente com base nas suas classes @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Configuração do JWT
# A chave precisa ter pelo menos 32 caracteres (256 bits) para o algoritmo HS256
# Vazia = o JwtService sorteia uma chave a cada vez que o backend sobe (os logins caem ao reiniciar)
jwt.secret=${JWT_SECRET:}
# Validade do token em milissegundos (86400000 = 24 horas)
jwt.expiration=${JWT_EXPIRATION:86400000}

# Endereços do front que podem chamar a API (separados por vírgula)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
