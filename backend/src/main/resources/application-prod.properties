# Perfil de produção: vale quando SPRING_PROFILES_ACTIVE=prod (a imagem Docker já define isso).
# O que está aqui passa por cima do application.properties.
# A classe ChecagemDeProducao impede o back de subir se faltar banco, chave do JWT ou endereço do front.

# Sem endereço padrão: em produção o front publicado precisa ser informado
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Nada de dados de exemplo nem de console do banco em produção
app.dados-de-exemplo=false
spring.h2.console.enabled=false

# O SQL de cada consulta não vai para o log
spring.jpa.show-sql=false

# O back fica atrás do proxy da hospedagem (Render, Railway...). Com isto, ele lê o IP real
# de quem chamou e sabe que a conexão é HTTPS, o que o limite de tentativas e o HSTS precisam.
server.forward-headers-strategy=native
