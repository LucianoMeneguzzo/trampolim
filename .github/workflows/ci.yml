# Roda sozinho no GitHub a cada Pull Request para a main (e a cada merge na main).
# Se um teste quebrar, o PR mostra um X vermelho antes de alguém aprovar.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# O CI só precisa ler o código
permissions:
  contents: read

# Um push novo no mesmo PR cancela a execução anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Back-end (testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Testes (JUnit) e cobertura (JaCoCo)
        run: ./mvnw -B test

  frontend:
    name: Front-end (lint, testes e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instala as dependências
        run: npm ci
      - name: Padrão do código (ESLint)
        run: npm run lint
      - name: Testes (Vitest) com cobertura mínima de 70%
        run: npm run coverage
      - name: Build de produção
        run: npm run build

  docker:
    name: Imagens Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Imagem do back-end
        run: docker build -t trampolim-api ./backend
      - name: Imagem do front-end
        run: docker build -t trampolim-web ./frontend
