# Configuração do nginx que entrega o front dentro do Docker.
server {
    listen 8080;
    server_name _;
    server_tokens off; # não anuncia a versão do nginx

    root /usr/share/nginx/html;
    index index.html;

    # Cabeçalhos de segurança. A Content-Security-Policy vai dentro do index.html:
    # o vite.config.js a escreve no build, já com o endereço da API.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Os arquivos de /assets têm um código no nome que muda a cada build: podem ficar um ano no navegador.
    # (Usar "expires" em vez de "add_header" mantém os cabeçalhos de segurança acima.)
    location /assets/ {
        expires 1y;
    }

    # O index.html nunca fica guardado, para o navegador sempre buscar a versão nova
    location = /index.html {
        expires -1;
    }

    # As rotas do React (ex.: /student/search) não existem como arquivo: quem responde é o index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
